name: Build

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - v*.*.*
  schedule:
    # Run the tests at 7:23pm UTC on the 9th and 24th of every month
    - cron: '23 19 9,24 * *'

jobs:
  build:
    name: ${{ matrix.os }}, ${{ matrix.dep-versions }} dependencies
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]
        dep-versions: ["oldest", "latest"]
        # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ Set versions to test here ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
        include:
          - dep-versions: "oldest"
            PYTHON_VERSION: "3.11"
            PIP_VERSION: "23.0.1"  # pip>=23.1 cannot build the oldest OpenMDAO
            SETUPTOOLS_VERSION: "66.0.0"  # setuptools >= 67.0.0 can't build the oldest OpenMDAO
            NUMPY_VERSION: "1.25"
            SCIPY_VERSION: "1.11.0"
            OPENMDAO_VERSION: "3.35"
          - dep-versions: "latest"
            PYTHON_VERSION: "3.13"  # all other packages are the most recent on PyPI
      fail-fast: false
    env:
      OMP_NUM_THREADS: 1
    defaults:
      run:
        shell: bash -l {0}
    steps:
    - uses: actions/checkout@v3
    - name: Setup Python
      uses: conda-incubator/setup-miniconda@v3
      with:
        auto-update-conda: true
        python-version: ${{ matrix.PYTHON_VERSION }}

    - name: Install dependencies (oldest versions)
      if: ${{ matrix.dep-versions == 'oldest' }}
      run: |
        python -m pip install pip==${{ matrix.PIP_VERSION }} setuptools==${{ matrix.SETUPTOOLS_VERSION }} --upgrade wheel
        conda install -y -c conda-forge numpy=${{ matrix.NUMPY_VERSION }} scipy=${{ matrix.SCIPY_VERSION }}
        pip install openmdao==${{ matrix.OPENMDAO_VERSION }}
    - name: Install dependencies (latest versions)
      if: ${{ matrix.dep-versions == 'latest' }}
      run: |
        # pyCycle's NumPy 2 fixes have not been released yet, so install it from GitHub
        pip install git+https://github.com/OpenMDAO/pyCycle.git

    - name: Install OpenConcept
      run: |
        pip install -e .[testing,docs]

    - name: List Python and package info
      run: |
        python --version
        pip list

    - name: Download engine deck surrogate model
      run: |
        curl -L -o engine_kriging_surrogate_model.tar.gz https://websites.umich.edu/~mdolaboratory/repo_files/openconcept/engine_kriging_surrogate_model.tar.gz
    - name: Move engine deck files to appropriate location
      run: |
        tar -xvf engine_kriging_surrogate_model.tar.gz
        mv cfm56* ./openconcept/propulsion/empirical_data/cfm56
        mv n3_hybrid* ./openconcept/propulsion/empirical_data/n+3_hybrid
        mv n3* ./openconcept/propulsion/empirical_data/n+3

    - name: Test
      run: |
        python -m pytest --cov-config=.coveragerc --cov=openconcept --cov-report=xml

    - name: Test if engine deck data is included in package
      if: ${{ matrix.os == 'ubuntu-latest' && matrix.dep-versions == 'latest' }}
      run: |
        # Build the wheel and source distribution
        pip install build setuptools wheel
        python -m build

        # Create a fresh venv to simulate a clean install
        python -m venv venv_test_pkg
        source venv_test_pkg/bin/activate

        # Install the wheel, not in editable mode
        pip install dist/openconcept-*.whl

        # Check that the .npy files are installed
        python - <<'PYCODE'
        import importlib.resources as r
        import pathlib

        files = list(pathlib.Path(r.files('openconcept.propulsion.empirical_data')).rglob('*.npy'))
        if not files:
            raise SystemExit('No .npy files found in installed package!')
        print(f'Found {len(files)} .npy data files.')
        PYCODE

    - name: Upload coverage to Codecov
      if: ${{ matrix.os == 'ubuntu-latest' }}
      uses: codecov/codecov-action@v4
      with:
        fail_ci_if_error: true
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # --- publish to PyPI
  pypi:
    needs: [build]
    uses: mdolab/.github/.github/workflows/pypi.yaml@main
    secrets: inherit
